management 0.0.0.0 2080  # Don't change this line. OpenVPN UI uses this feature to manage the server
dev tun
port 1194
proto udp
topology subnet
keepalive 10 120
inactive 3600 100
max-clients 300
persist-key
persist-tun
explicit-exit-notify 1
user nobody
group nogroup
client-config-dir /etc/openvpn/staticclients
ifconfig-pool-persist pki/ipp.txt
ca pki/ca.crt
cert pki/issued/server.crt
key pki/private/server.key
crl-verify pki/crl.pem
dh pki/dh.pem
tls-crypt pki/ta.key
tls-version-min 1.2
remote-cert-tls client
cipher AES-256-GCM
data-ciphers AES-256-GCM:AES-192-GCM:AES-128-GCM
auth SHA512
server 10.8.0.0 255.255.255.0              # VPN subnet — change if needed
push "dhcp-option DNS 8.8.8.8"             # Primary DNS
push "dhcp-option DNS 1.1.1.1"             # Secondary DNS
push "redirect-gateway def1 bypass-dhcp"   # Route all client traffic through VPN
log /var/log/openvpn/openvpn.log
verb 3
status /var/log/openvpn/openvpn-status.log
status-version 2
